services:
  db:
    image: mongo:4.4
  app:
    build: .
    command: /bin/sh -c "mkdir -p artifacts/cert && openssl req -x509 -newkey rsa:4096 -keyout artifacts/cert/server.key -out artifacts/cert/server.crt -days 365 -nodes -subj '/CN=localhost' && npm start"
    ports:
      - "4001:4000"
    depends_on:
      - db
    environment:
      - MONGODB_URI=mongodb://db:27017/nodegoat
    tty: true
    stdin_open: true
